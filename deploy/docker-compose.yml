services:
  backend:
    image: ${IMAGE}
    env_file: [.env]
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      # Django answers 400 to a Host it doesn't know, and 127.0.0.1 isn't in
      # DJANGO_ALLOWED_HOSTS, so send the first allowed host instead.
      test: ["CMD-SHELL", "curl -fsS -H \"Host: $${DJANGO_ALLOWED_HOSTS%%,*}\" http://127.0.0.1:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    depends_on: [backend]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
