[project]
name = "route-builder-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.5",
    "pyjwt[crypto]>=2.10",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.django_configs"
python_files = ["test_*.py"]
# ponytail: Supabase's pooler keeps a warm connection open to the test DB,
# which makes DROP DATABASE at teardown flaky. Reuse it across runs instead
# of dropping/recreating every time; run `pytest --create-db` once after a
# migration change to force a rebuild.
addopts = "--reuse-db"

