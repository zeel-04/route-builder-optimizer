name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

# Images go to the shared Docker Hub repo, one tag namespace per app. The sha
# tag is what gets deployed (and rolled back to); the -prod tag just tracks it.
env:
  IMAGE_REPO: sjenterprise/global
  IMAGE_TAG_PREFIX: route-builder
  API_HOST: api.route-builder.sjenterpriseusa.com

jobs:
  # Nothing is built or deployed unless the test suite passes. The tests need
  # no secrets and no network: a throwaway Postgres, and the geocoders are faked
  # (the real-API checks are `pytest -m live`, run by hand).
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: route_builder
      DB_USER: postgres
      DB_PASSWORD: ci-pass
      DJANGO_SECRET_KEY: ci-not-a-secret
      DJANGO_DEBUG: "false"
      SSO_ENABLED: "false"
      NOMINATIM_URL: https://nominatim.openstreetmap.org
      NOMINATIM_USER_AGENT: route-builder-ci
      GEOCODER_CLASS: api.customers.geocoders.NominatimGeocoder
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG_PREFIX }}-${{ github.sha }}
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG_PREFIX }}-prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deploy directory to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/"
          target: "~/app/"
          strip_components: 0

      - name: Write .env and restart stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eo pipefail
            cd ~/app/deploy

            umask 077
            cat > .env <<'ENVEOF'
            IMAGE=${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG_PREFIX }}-${{ github.sha }}

            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_DEBUG=false
            DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}
            DJANGO_CSRF_TRUSTED_ORIGINS=${{ secrets.DJANGO_CSRF_TRUSTED_ORIGINS }}

            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            NOMINATIM_URL=${{ secrets.NOMINATIM_URL }}
            NOMINATIM_USER_AGENT=${{ secrets.NOMINATIM_USER_AGENT }}
            GEOCODER_CLASS=${{ secrets.GEOCODER_CLASS }}

            # Must match the frontend's SSO_ENABLED / OIDC_* in Amplify;
            # OIDC_CLIENT_ID is the ID token's audience.
            SSO_ENABLED=${{ secrets.SSO_ENABLED }}
            OIDC_DISCOVERY_URL=${{ secrets.OIDC_DISCOVERY_URL }}
            OIDC_CLIENT_ID=${{ secrets.OIDC_CLIENT_ID }}
            ENVEOF

            echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin

            docker compose pull
            # Migrate with the new image before anything switches to it: new code
            # never runs against an old schema, and a failed migration stops the
            # deploy (set -e) with the old containers still serving. The old code
            # does run against the new schema for a few seconds, so a migration
            # that breaks it (dropping a column it reads) has to ship in two steps.
            docker compose run --rm --entrypoint python backend manage.py migrate --noinput
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Wait for the API to come up healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${API_HOST}/healthz/" >/dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy" >&2
          exit 1
